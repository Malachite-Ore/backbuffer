name: Backbuffer CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build, Test & Package Universal macOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI output directory
        run: |
          mkdir -p ci-output/previews
          {
            swift --version
            xcodebuild -version
          } > ci-output/env.log 2>&1

      - name: Run BackbufferCoreTests
        run: |
          set -o pipefail
          swift test 2>&1 | tee ci-output/test.log

      - name: Build Universal Release Binary (arm64 + x86_64)
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee ci-output/build.log

      - name: Render Retina UI Previews
        run: |
          set -o pipefail
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          APP_BIN="$BIN_DIR/BackbufferApp"
          if [ ! -x "$APP_BIN" ]; then
            APP_BIN=".build/apple/Products/Release/BackbufferApp"
          fi
          "$APP_BIN" --render-previews ci-output/previews 2>&1 | tee ci-output/previews.log
          ls -lh ci-output/previews
          for f in hub_library_preview.png trimmer_theatre_preview.png settings_preview.png menubar_preview.png; do
            test -s "ci-output/previews/$f" || { echo "Missing or empty preview PNG: $f"; exit 1; }
          done

      - name: Package Backbuffer.app and Backbuffer-Universal.dmg
        run: |
          set -o pipefail
          chmod +x scripts/package_app.sh
          ./scripts/package_app.sh 2>&1 | tee ci-output/package.log

      - name: Upload CI Logs & UI Previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backbuffer-ci-output
          path: ci-output/
          retention-days: 14

      - name: Publish CI Logs & Previews to ci-artifacts Branch
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d ci-output ]; then
            TMP_DIR="$(mktemp -d)"
            cp -R ci-output "$TMP_DIR/ci-output"
            cd "$TMP_DIR"
            git init -b ci-artifacts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-output
            git commit -m "ci: artifacts for ${GITHUB_SHA}"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin ci-artifacts
          fi

      - name: Publish Universal DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Backbuffer-Universal.dmg
          generate_release_notes: true
